# Configuração Alembic para migrações assíncronas (SQLAlchemy 2.0 + asyncpg).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Sobrescrito em runtime pela variável de ambiente DATABASE_URL em alembic/env.py
sqlalchemy.url = postgresql+asyncpg://ferry:ferry_local@localhost:5432/ferry_telemetry

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

